name: Collect official NIJISANJI news
on:
  workflow_dispatch:
  schedule:
    # JST 00:00 = UTC 15:00 (previous day); JST 12:00 = UTC 03:00
    - cron: '0 3,15 * * *'
permissions:
  contents: write
concurrency:
  group: nijidb-official-news
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch official news
        id: fetch
        run: node scripts/collect-official-news.mjs
      - name: Record report
        if: always()
        run: cat public/data/official-news-report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Save successful results
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/official-news.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update official news data'
          git pull --rebase origin main
          git push origin HEAD:main
